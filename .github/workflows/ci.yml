name: CI

on:
  pull_request:
  # Also run on every merge to main. Each PR is tested against main as it was
  # when its CI last ran, so two PRs that pass separately can still break main
  # together; this catches that right after the merge.
  push:
    branches: [main]
  # The release workflow runs the same checks on the tagged commit.
  workflow_call:

permissions:
  contents: read

# One run per PR at a time (a new push cancels the outdated run). Runs on main
# are keyed by commit and never cancelled, so every merge gets a result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every cargo command that resolves dependencies (all but fmt) uses --locked:
# Cargo.lock is committed, and CI must fail rather than silently resolve
# different dependency versions.
env:
  CARGO_TERM_COLOR: always
  # No debug info for the dev/test profile in CI: faster builds and a smaller
  # cache. Panic messages still report file:line.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml is the single source of truth. With no arguments,
      # `rustup toolchain install` (rustup >= 1.28) installs the channel,
      # components and wasm32 target it pins. Never use a floating `stable`.
      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustc --version --verbose
          cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt
        run: cargo fmt --check

      # --all-targets lints test code too.
      - name: cargo clippy (host)
        run: cargo clippy --locked --all-targets -- -D warnings

      # Plugins compile this crate for wasm32, and `now()` only exists there.
      - name: cargo clippy (wasm32)
        run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings

      - name: cargo test
        run: cargo test --locked

      - name: cargo build (wasm32)
        run: cargo build --locked --target wasm32-unknown-unknown

      - name: cargo doc
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads rust-version from Cargo.toml so the job can't drift from it.
      # `cargo +<version>` overrides rust-toolchain.toml.
      - name: Install MSRV toolchain
        run: |
          msrv=$(sed -nE 's/^rust-version *= *"([^"]+)".*/\1/p' Cargo.toml)
          if [ -z "$msrv" ]; then
            echo "::error file=Cargo.toml::rust-version is not set"
            exit 1
          fi
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
          rustup toolchain install "$msrv" --profile minimal --target wasm32-unknown-unknown --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The wasm32 build is what enforces the MSRV (`unsafe extern` in `now()`).
      # --locked also proves the committed Cargo.lock builds on the MSRV: with
      # edition 2021 the resolver is not MSRV-aware, so a dependency update
      # that needs a newer rustc fails here.
      - name: cargo build (wasm32, MSRV)
        run: cargo +"$MSRV" build --locked --target wasm32-unknown-unknown

      - name: cargo test (MSRV)
        run: cargo +"$MSRV" test --locked

  # Fails if the public API breaks in a way the Cargo.toml version bump doesn't
  # allow (within 0.x, a breaking change needs a minor bump). The baseline is
  # the newest v* tag reachable from this commit, so it moves with releases.
  semver:
    name: Semver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, for the baseline

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install --no-self-update

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-semver-checks@0.51.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: semver
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo semver-checks
        run: |
          baseline=$(git describe --tags --abbrev=0 --match 'v*')
          echo "Baseline: $baseline; Cargo.toml version: $(sed -nE 's/^version *= *"([^"]+)".*/\1/p' Cargo.toml)"
          cargo semver-checks check-release --baseline-rev "$baseline"
