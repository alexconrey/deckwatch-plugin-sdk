[package]
name = "deckwatch-plugin-sdk"
version = "0.10.0"
edition = "2021"
# MSRV. 1.82 is the first release that accepts the `unsafe extern "C"` block in
# `now()` (wasm32 only). Raising it is a breaking change: bump the minor version.
rust-version = "1.82"
description = "Shared types for deckwatch plugins — import this in your plugin crate alongside extism-pdk"
repository = "https://github.com/alexconrey/deckwatch-plugin-sdk"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
